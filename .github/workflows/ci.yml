name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (Pest + PHPStan + Pint) — SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, gd, exif, pcntl, bcmath, intl, zip, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: |
          php -r "touch('database/database.sqlite');"
          php artisan migrate --force

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pest (test suite, collect JUnit)
        run: php artisan test --log-junit junit.xml || true

      - name: Report test failures (annotations) and fail
        run: |
          php -r '
            $f = "junit.xml";
            if (! file_exists($f)) { echo "::error title=junit::junit.xml missing"; exit(1); }
            $x = simplexml_load_file($f);
            $node = $x->xpath("//testcase[failure | error]");
            if (! $node) { echo "no testcase failures found in junit\n"; exit(0); }
            foreach ($node as $tc) {
              $msg = (string) ($tc->failure ?? $tc->error);
              $msg = str_replace(["\r", "\n"], " ", substr(trim($msg), 0, 800));
              $name = (string) $tc["name"];
              $cls  = (string) $tc["class"];
              echo "::error title={$cls}::{$name}: {$msg}\n";
            }
            exit(1);
          '

  backend-mysql:
    name: Backend (Pest) — MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ems_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, gd, exif, pcntl, bcmath, intl, zip, mysqli, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run test suite against MySQL (audit §3.2, collect JUnit)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ems_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --log-junit junit.xml || true

      - name: Report test failures (annotations) and fail
        run: |
          php -r '
            $f = "junit.xml";
            if (! file_exists($f)) { echo "::error title=junit::junit.xml missing"; exit(1); }
            $x = simplexml_load_file($f);
            $node = $x->xpath("//testcase[failure | error]");
            if (! $node) { echo "no testcase failures found in junit\n"; exit(0); }
            foreach ($node as $tc) {
              $msg = (string) ($tc->failure ?? $tc->error);
              $msg = str_replace(["\r", "\n"], " ", substr(trim($msg), 0, 800));
              $name = (string) $tc["name"];
              $cls  = (string) $tc["class"];
              echo "::error title={$cls}::{$name}: {$msg}\n";
            }
            exit(1);
          '

  frontend:
    name: Frontend (ESLint + Vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vite build
        run: npm run build

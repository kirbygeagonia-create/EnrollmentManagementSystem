name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# The runner image is pinned, not floated. `ubuntu-latest` moves to Ubuntu 26 on 2026-10-19 (GitHub's own
# annotation on every run since then), and this suite has one check that depends on what the image ships:
# PrintRendererTest locates a browser and SKIPS rather than fails when none is found, so a new image could
# have turned CI green into CI proving less with nothing red. Pinning buys the decision; the skip guard at
# the end of each backend job is what keeps the decision honest when the pin moves.
jobs:
  backend:
    name: Backend (Pest + PHPStan + Pint) — SQLite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, gd, exif, pcntl, bcmath, intl, zip, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: |
          php -r "touch('database/database.sqlite');"
          php artisan migrate --force

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pest (test suite, collect JUnit)
        run: php artisan test --log-junit junit.xml || true

      - name: Report test failures (annotations) and fail
        run: |
          php -r '
            $f = "junit.xml";
            if (! file_exists($f)) { echo "::error title=junit::junit.xml missing"; exit(1); }
            $x = simplexml_load_file($f);
            $node = $x->xpath("//testcase[failure | error]");
            if (! $node) { echo "no testcase failures found in junit\n"; exit(0); }
            foreach ($node as $tc) {
              $msg = (string) ($tc->failure ?? $tc->error);
              $msg = str_replace(["\r", "\n"], " ", substr(trim($msg), 0, 800));
              $name = (string) $tc["name"];
              $cls  = (string) $tc["class"];
              echo "::error title={$cls}::{$name}: {$msg}\n";
            }
            exit(1);
          '

      - name: Refuse a silently skipped check
        run: php artisan ems:ci:no-silent-skips junit.xml

      - name: Check the documents' suite and class figures
        run: |
          # The authority document states how big the suite is and how big three of its pinned classes are, and those
          # figures move with every case anyone adds. Nothing watched them: the §1.1 row that read "the suite stands at
          # 771 tests and 5191 assertions" matched no surface when it was re-measured on 2026-10-20, and it had survived
          # three passes of being read because 771 *is* what CI prints for passed tests — beside an assertion count that
          # came from this box on one earlier day. The step lives in the SQLite job because that is the suite the
          # document's figures were measured on: the same code answers 5,013 assertions here and 5,015 on MySQL, and that
          # difference is the finding rather than a nuisance to reconcile. --ci judges only what this runner can measure —
          # this junit and `phpunit --list-tests` — and names the claims about the box's own run that only the box can
          # check. The dump is regenerated because the document, not its dump, is what is committed. Proved able to fail
          # by storage/app/scratch/mutate-lane58-suite-claims.php.
          php storage/app/scratch/dump-docx-flat.php
          php storage/app/scratch/lane58-suite-claims.php --ci --junit=junit.xml

      - name: Check the figures the citation sweeps print
        run: |
          # Nine figures that these tools print were stale on 2026-10-20, eight of them in AGENTS.md — the file that tells
          # the next batch what each gate answers. The checker binds a figure only where the sentence names the tool whose
          # summary prints it, so the runner measures the four citation sweeps here and leaves the database-bound tools to
          # this box, naming them rather than passing them unseen (see lane 59's gate note in AGENTS.md). This file's own
          # §-references move the counts it states, which is why the numbers are re-read here and not remembered.
          php storage/app/scratch/lane59-instrument-counts.php --ci --run \
            --only=sweep-docx-citations,lane37-section-reference-sweep,lane37b-repo-citation-sweep,lane32-cite-meaning-sweep

      - name: Refuse a document that asks what its own registers answer
        run: |
          # Lane 61's class is a status word, not a figure: §28.7 put nine items in "the order these should be taken
          # in" while each of those ids' own row began "Closed 2026-10-0…", §28.8 counted 46 owed slots from a column
          # that now names an actor in eight rows, §30.6 named four open items its registers had ruled on, and §25.5
          # said the settings table has no effect on a printed document twenty days after the provider that bridges
          # it landed. No citation sweep can see that: every pointer lands on a live line, every §-reference resolves,
          # and lane 60 had just corrected the figures beside those very sentences. It reads only the dump the step
          # above regenerates, so it runs here with no database — and mutate-lane61-open-claims.php proves it refuses,
          # including the four shapes it must NOT flag (a self-answering sentence, an id borrowed across sentences, a
          # dated §1.1 row, and a gap whose title begins with the word "Open").
          php storage/app/scratch/lane61-open-claims.php

      - name: Refuse a citation that lands on a blank line or a table that disagrees with its own column
        run: |
          # Two bounds that nothing enforced until 2026-10-24. The first: `ClearanceController.php:380 and :404` is one
          # sentence and two citations, and a sweep that needs a filename before the colon sees only the first — so when
          # P-17 grew printSlip() by four lines, the same §-section carried the download action's new number in one row
          # and the old one in another, and the old one is now a blank line. The sweep now attributes a bare `:NN` to the
          # file named before it on the same line (within 160 characters; further than that it prints the token as a blind
          # spot instead of guessing), and mutate-lane69-bare-cites.php proves it refuses a planted blank line, a planted
          # past-end number, and a missing dump, and that the 160-character rule really moves the token into the blind list.
          # The second: §28.8's "Who owes what" table asserted 46 owed slots while lane61-who-owes counted 8 from the
          # column it claims to be counted from, and 2 after the owner's rulings that day. AGENTS.md recorded that
          # discrepancy and left it standing for a pass, because no checker compared the table to its source. This step
          # asks the proved instrument rather than re-classifying, and mutate-lane69-owes-table.php proves it refuses a
          # re-grown count, an identifier the column no longer charges to anyone, and an owed item dropped in favour of
          # a closed one — with a byte-identical control, so --dump= is shown to be read.
          php storage/app/scratch/sweep-docx-citations.php
          php storage/app/scratch/lane69-owes-table-check.php

      - name: Refuse a §24 model declaration the class does not make
        run: |
          # The seventh prose family, and the one no earlier judge could see: a sentence that states how the code
          # behaves today carries no status word (lane61), no figure (lane58, 59, 60), no instrument count (lane59) and
          # no dead line number (the sweeps) — so §19.4, §20 and §24.14 went on narrating gap N-1 in the present tense
          # twenty-four days after §28.3 closed it and after both listeners had started writing staff-addressed rows.
          # §28.3 G-31 records that, and this is the first checker for the class: §24 states, for every table,
          # `$primaryKey = 'someId'` and `$timestamps = true|false`, and the model file either declares those two
          # properties or takes Laravel's defaults — a claim narrow enough to answer with no judgement call at all.
          # It reads 54 claims / 54 model files and answers 0 problems; mutate-lane71-model-decls.php proves all eight
          # legs can fail — a planted primary key, a planted timestamps flag, a path that is not in the repository, a
          # byte-identical control that must move no verdict, and three refusals told apart by their own messages
          # (judged-nothing, missing dump, unknown flag), because a tool that prints 0 problems after reading nothing
          # is the failure mode this whole lane exists to catch.
          php storage/app/scratch/dump-docx-flat.php
          php storage/app/scratch/lane71-model-decls.php

      - name: Refuse a notification addressee the document and the code disagree about
        run: |
          # The second member of the same class, and the half that is portable: `lane71-morph-targets.php` reads one
          # value — who a notification is addressed to — from three surfaces, what the document asserts, what the
          # listeners pass, and what `notifications.notifiable_type` actually holds. Gap N-1 was the defect: four
          # sections narrated `App\Models\Students` in the present tense after §28.3 had closed it and both listeners
          # wrote staff rows. Only the two surfaces a runner can reach are judged here — the row count belongs to
          # whichever database stated it (lane 60's rule), and the SQLite job has no persistent MySQL to ask — so
          # `--ci` NAMES the third surface instead of reading it, and the run refuses an `--allow-schema` it would
          # have no database to honour rather than accepting the flag inertly. mutate-lane71-morph-targets.php proves
          # all twelve legs can fail, including that `--ci` still refuses a document claim the code disproves: a step
          # that stopped judging would otherwise look like the cleanest step in the job.
          php storage/app/scratch/lane71-morph-targets.php --ci

      - name: Refuse a DATE column written from the machine's clock
        run: |
          # The write side of lane 51's rule, and the seventh shape no gate could see. Lane 50 polices the shapes
          # `now()->toDateString()` and `whereDate(…)`, but a column the migration calls DATE and fed a plain
          # Carbon matches neither — Eloquent formats a `date` cast in the application's timezone, UTC here, so
          # between 16:00Z and midnight the desk's own record carried the day before the school's. §28.3 G-43
          # records the gap; this binds every `'xDate' => now()` write to the column type the MIGRATIONS declare,
          # so it needs no database and runs on the runner as well as on this box. It carries a planted positive
          # control — one write per DATE column in a throwaway file, recovered through the same reader — because
          # a control keyed to the defects the tree happened to hold on the day it was written refuses against
          # the batch that repairs them, which is exactly how its first version behaved. Writes whose column no
          # migration declares as DATE are printed UNBOUND rather than cleared: those are instants, and §1.2 says
          # the viewer's zone is right for them. mutate-lane87-school-day-writes.php proves the whole family —
          # it plants the retired write at each pinned desk site and requires both that site's own frozen-clock
          # case to report a failure and this step to exit 1 naming the column, then blinds the instrument in two
          # copies, each of which must refuse rather than report a clean sweep.
          php storage/app/scratch/lane87-date-write-columns.php --ci

  backend-mysql:
    name: Backend (Pest) — MySQL 8
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ems_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, gd, exif, pcntl, bcmath, intl, zip, mysqli, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite against MySQL (audit §3.2, collect JUnit)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ems_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --log-junit junit.xml || true

      # The walkthrough legs read reference rows that migrations never create, and they cannot run in the
      # step above: RefreshDatabase migrates fresh, which would wipe anything seeded before it. So they get
      # their own step, seeded immediately beforehand, and --fail-on-skipped makes a leg that could not run
      # a hard failure — otherwise this job would report four green skips and prove nothing.
      - name: Seed the reference data the walkthrough reads
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ems_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate --force
          php artisan db:seed --force
          php artisan db:seed --class=DevReferenceDataSeeder --force

      # The demo pipeline is what fills every desk queue, and until 2026-10-16 it could not run here at all: it
      # refused on a schema that did not already hold its two named base students, and only
      # `Documentation/ems-demo-backup.sql` and the developer's live `ems` have those. It creates them now, so
      # this is the first place the dataset the project presents is built by a recipe nobody has to run by
      # hand — and the step is a gate rather than a log line, because the tool exits 1 on any finding its own
      # desk report lists (measured against a planted overpayment: exit 1, success banner withheld).
      - name: Seed the full demo pipeline
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ems_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php tools/seed_full_demo_pipeline.php

      - name: Check the documents' schema-independent claims
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ems_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          # --ci restricts this to the claims that hold on ANY correctly seeded schema: the program, role,
          # clearance-line and catalog counts, the slip fee resolved by name, and Juan Dela Cruz's itemised
          # sheet. The guides also name records by the numbers this developer's repaired box happens to carry
          # (enrollment 87 owes ₱17,500; "21 staff accounts", where a rebuilt box has 20) — those stay local
          # gates against `ems`, because on a CI-ordered schema they cannot be true. Proved able to fail by
          # storage/app/scratch/mutate-lane41-claims.php.
          php storage/app/scratch/lane41-doc-claims.php --ci

      # Lane 60's half of the same discipline, over the figures that describe the SCHEMA: the census sentence, the
      # domain/framework split, the per-table column counts of §24, the foreign-key totals and the delete-rule split.
      # These are properties of the migrations, so a schema CI builds from nothing may answer them — and if the answer
      # differs from this box's, that is the finding (a manual ALTER on the developer's database, or a migration that
      # does not apply clean), not a nuisance. Row counts are excluded by --ci and named instead: `42 assignments over
      # 17 roles` is a fact about whichever database stated it, and on ems_test it is a different number honestly.
      # The dump is regenerated because it is gitignored, and the probe refuses a schema it was not told to read.
      - name: Check the census and column counts against the schema
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ems_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php storage/app/scratch/dump-docx-flat.php
          php storage/app/scratch/lane60-ratio-claims.php --ci --run --allow-schema=ems_test

      - name: Run the end-to-end walkthrough against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ems_test
          DB_USERNAME: root
          DB_PASSWORD: root
          E2E_DB_DATABASE: ems_test
        run: vendor/bin/phpunit tests/Feature/E2E --fail-on-skipped --log-junit junit-e2e.xml

      - name: Report test failures (annotations) and fail
        run: |
          php -r '
            $f = "junit.xml";
            if (! file_exists($f)) { echo "::error title=junit::junit.xml missing"; exit(1); }
            $x = simplexml_load_file($f);
            $node = $x->xpath("//testcase[failure | error]");
            if (! $node) { echo "no testcase failures found in junit\n"; exit(0); }
            foreach ($node as $tc) {
              $msg = (string) ($tc->failure ?? $tc->error);
              $msg = str_replace(["\r", "\n"], " ", substr(trim($msg), 0, 800));
              $name = (string) $tc["name"];
              $cls  = (string) $tc["class"];
              echo "::error title={$cls}::{$name}: {$msg}\n";
            }
            exit(1);
          '

      - name: Refuse a silently skipped check
        run: php artisan ems:ci:no-silent-skips junit.xml junit-e2e.xml

  frontend:
    name: Frontend (ESLint + Vite build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vite build
        run: npm run build
